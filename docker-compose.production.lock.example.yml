# Copy to docker-compose.production.lock.yml (gitignored), replace each digest,
# and run scripts/verify-production-pins.ps1 before deployment.
services:
  relay:
    image: ghcr.io/block/buzz@sha256:REPLACE_WITH_64_HEX_CHARACTERS
  postgres:
    image: pgvector/pgvector@sha256:REPLACE_WITH_64_HEX_CHARACTERS
  redis:
    image: redis@sha256:REPLACE_WITH_64_HEX_CHARACTERS
  minio:
    image: minio/minio@sha256:REPLACE_WITH_64_HEX_CHARACTERS
  minio-init:
    image: minio/mc@sha256:REPLACE_WITH_64_HEX_CHARACTERS
  ollama:
    image: ollama/ollama@sha256:REPLACE_WITH_64_HEX_CHARACTERS
  ollama-init:
    image: ollama/ollama@sha256:REPLACE_WITH_64_HEX_CHARACTERS
  gcor-migrate:
    image: pgvector/pgvector@sha256:REPLACE_WITH_64_HEX_CHARACTERS
  gcor-proxy:
    image: gbuzz-gcor-proxy:REPLACE_WITH_GIT_COMMIT
  mcp-postgres-gcor:
    image: gbuzz-mcp-postgres-gcor:REPLACE_WITH_GIT_COMMIT
  falkordb:
    image: falkordb/falkordb@sha256:REPLACE_WITH_64_HEX_CHARACTERS
  graphiti-mcp:
    image: gbuzz-graphiti-mcp:REPLACE_WITH_GIT_COMMIT
  graphiti-projector:
    image: gbuzz-graphiti-projector:REPLACE_WITH_GIT_COMMIT
  gcor-event-projector:
    image: gbuzz-event-projector:REPLACE_WITH_GIT_COMMIT
