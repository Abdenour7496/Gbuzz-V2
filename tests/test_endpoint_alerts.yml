rule_files:
  - ../observability/alerts.yml
evaluation_interval: 1m
tests:
  - name: partial collector failure while endpoint stays reachable
    interval: 1m
    input_series:
      - series: 'up{job="windows",instance="host:9182",endpoint="test"}'
        values: '1+0x10'
      - series: 'windows_exporter_collector_success{job="windows",instance="host:9182",endpoint="test",collector="memory"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: WindowsEndpointCollectorFailed
        exp_alerts: []
      - eval_time: 5m
        alertname: WindowsEndpointCollectorFailed
        exp_alerts:
          - exp_labels:
              job: windows
              instance: host:9182
              endpoint: test
              collector: memory
              severity: warning
            exp_annotations:
              summary: Windows collector memory is failing on test
  - name: offline endpoint suppresses duplicate collector failure
    interval: 1m
    input_series:
      - series: 'up{job="windows",instance="host:9182",endpoint="test"}'
        values: '0+0x10'
      - series: 'windows_exporter_collector_success{job="windows",instance="host:9182",endpoint="test",collector="memory"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: WindowsEndpointCollectorFailed
        exp_alerts: []
  - name: critically full disk
    interval: 1m
    input_series:
      - series: 'windows_logical_disk_free_bytes{job="windows",instance="host:9182",endpoint="test",volume="C:"}'
        values: '4+0x10'
      - series: 'windows_logical_disk_size_bytes{job="windows",instance="host:9182",endpoint="test",volume="C:"}'
        values: '100+0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: WindowsEndpointDiskCapacityCritical
        exp_alerts:
          - exp_labels:
              job: windows
              instance: host:9182
              endpoint: test
              volume: 'C:'
              severity: critical
            exp_annotations:
              summary: 'Windows volume C: on test has less than 5% free capacity'
