services:
  gcor-event-projector:
    image: gbuzz-gcor-event-projector:attachment-media-fix-20260927
    pull_policy: never
    environment:
      PROJECTOR_MEDIA_S3_ENDPOINT: http://minio:9000
      PROJECTOR_MEDIA_S3_BUCKET: ${BUZZ_S3_BUCKET:-buzz-media}
      PROJECTOR_MEDIA_S3_ACCESS_KEY: ${PROJECTOR_MEDIA_S3_ACCESS_KEY:?set PROJECTOR_MEDIA_S3_ACCESS_KEY}
      PROJECTOR_MEDIA_S3_SECRET_KEY: ${PROJECTOR_MEDIA_S3_SECRET_KEY:?set PROJECTOR_MEDIA_S3_SECRET_KEY}
