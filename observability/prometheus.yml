global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: gcor
    metrics_path: /metrics
    static_configs:
      - targets: [gcor-proxy:5001]
  - job_name: buzz-relay
    static_configs:
      - targets: [relay:9102]
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]
  - job_name: recovery-controller
    static_configs:
      - targets: [recovery-controller:8080]
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: windows
    file_sd_configs:
      - files: [/etc/prometheus/targets/windows.yml]
        refresh_interval: 1m
    params:
      collect[]:
        - cpu
        - logical_disk
        - memory
        - net
        - os
        - service
        - system
