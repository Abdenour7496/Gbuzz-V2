groups:
  - name: gbuzz
    rules:
      - alert: IngestionJobsFailed
        expr: gcor_ingestion_jobs{status="failed"} > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Ingestion jobs require review in the knowledge workspace
      - alert: IngestionQueueDelayed
        expr: gcor_ingestion_oldest_pending_seconds > 600
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Ingestion queue is more than ten minutes behind
      - alert: IngestionWorkerStalled
        expr: gcor_ingestion_worker_age_seconds > 600
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Ingestion worker has stopped making progress
      - alert: GbuzzTargetDown
        expr: up{job=~"gcor|buzz-relay|postgres|redis"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Gbuzz target {{ $labels.job }} is unavailable"
      - alert: GcorAttachmentReplayErrors
        expr: increase(gcor_attachment_replay_failures_total[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Attachment replay failures detected
      - alert: GcorErrorRateHigh
        expr: sum(rate(gcor_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(gcor_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: GCOR HTTP 5xx error rate exceeds 5%
      - alert: GcorP95LatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(gcor_http_request_duration_seconds_bucket[5m]))) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: GCOR p95 HTTP latency exceeds 2 seconds
      - alert: GovernancePublicationDelayed
        expr: gcor_governance_oldest_pending_seconds > 300
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Governance audit publication is more than five minutes behind
      - alert: GovernancePublicationRetrying
        expr: gcor_governance_retrying_events > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Governance audit events are retrying object storage publication
      - alert: GraphitiProjectionDeadLetter
        expr: gcor_graphiti_projection_entries{status="dead_letter"} > 0 and on() gbuzz_recovery_service_healthy{service="graphiti-projector"}
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Graphiti projection has dead-letter entries
      - alert: GraphitiProjectionLagHigh
        expr: gcor_graphiti_oldest_unfinished_seconds > 900 and on() gbuzz_recovery_service_healthy{service="graphiti-projector"}
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Oldest unfinished Graphiti projection exceeds 15 minutes
      - alert: PostgresConnectionsNearLimit
        expr: sum(pg_stat_activity_count) / min(pg_settings_max_connections) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL is using more than 80% of available connections
      - alert: RedisMemoryNearLimit
        expr: redis_memory_max_bytes > 0 and redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Redis is using more than 85% of its memory limit
      - alert: HostDiskCapacityLow
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} has less than 15% free capacity"
      - alert: GbuzzRecoveryControllerDown
        expr: up{job="recovery-controller"} == 0 or gbuzz_recovery_controller_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Gbuzz recovery controller cannot inspect the stack
      - alert: GbuzzManagedServiceUnhealthy
        expr: gbuzz_recovery_service_healthy == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Managed service {{ $labels.service }} is unhealthy"
      - alert: GbuzzRecoveryActionFailed
        expr: increase(gbuzz_recovery_actions_total{result="failure"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Automated recovery failed for {{ $labels.service }}"
      - alert: GbuzzRecoveryLoop
        expr: increase(gbuzz_recovery_actions_total{result="success"}[1h]) >= 3
        labels:
          severity: critical
        annotations:
          summary: Recovery action budget is at risk of exhaustion
