groups:
- name: gcor-parser-worker
  rules:
  - alert: GcorParserWorkerUnavailable
    expr: increase(gcor_parser_requests_total{status="unavailable"}[10m]) > 0
    for: 2m
    labels: {severity: critical}
    annotations:
      summary: "Isolated parser worker is unavailable"
  - alert: GcorParserWorkerFailures
    expr: sum(increase(gcor_parser_requests_total{status=~"timeout|rejected"}[15m])) > 5
    for: 5m
    labels: {severity: warning}
    annotations:
      summary: "Parser worker failures exceed the bounded threshold"
  - alert: GcorParserWorkerSaturation
    expr: gcor_parser_in_flight > 4
    for: 5m
    labels: {severity: warning}
    annotations:
      summary: "Parser worker backlog exceeds four concurrent requests"
  - name: gbuzz
    rules:
      - alert: IngestionJobsFailed
        expr: gcor_ingestion_jobs{status="failed"} > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Ingestion jobs require review in the knowledge workspace
      - alert: IngestionQueueDelayed
        expr: gcor_ingestion_oldest_pending_seconds > 600
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Ingestion queue is more than ten minutes behind
      - alert: IngestionWorkerStalled
        expr: gcor_ingestion_worker_age_seconds > 600
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Ingestion worker has stopped making progress
      - alert: GbuzzTargetDown
        expr: up{job=~"gcor|buzz-relay|postgres|redis"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Gbuzz target {{ $labels.job }} is unavailable"
      - alert: GcorAttachmentReplayErrors
        expr: increase(gcor_attachment_replay_failures_total[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Attachment replay failures detected
      - alert: GcorErrorRateHigh
        expr: sum(rate(gcor_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(gcor_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: GCOR HTTP 5xx error rate exceeds 5%
      - alert: GcorP95LatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(gcor_http_request_duration_seconds_bucket[5m]))) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: GCOR p95 HTTP latency exceeds 2 seconds
      - alert: GovernancePublicationDelayed
        expr: gcor_governance_oldest_pending_seconds > 300
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Governance audit publication is more than five minutes behind
      - alert: GovernancePublicationRetrying
        expr: gcor_governance_retrying_events > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Governance audit events are retrying object storage publication
      - alert: GbuzzBackupFailed
        expr: gbuzz_backup_last_run_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Most recent Gbuzz backup failed verification
      - alert: GbuzzBackupTooOld
        expr: time() - gbuzz_backup_last_success_unixtime > 21600
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: No verified Gbuzz backup has completed within the six-hour RPO
      - alert: GbuzzBackupMetricsMissing
        expr: absent(gbuzz_backup_last_success_unixtime)
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Gbuzz backup telemetry is missing
      - alert: PostgresConnectionsNearLimit
        expr: sum(pg_stat_activity_count) / min(pg_settings_max_connections) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL is using more than 80% of available connections
      - alert: RedisMemoryNearLimit
        expr: redis_memory_max_bytes > 0 and redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Redis is using more than 85% of its memory limit
      - alert: HostDiskCapacityLow
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} has less than 15% free capacity"
      - alert: GbuzzRecoveryControllerDown
        expr: up{job="recovery-controller"} == 0 or gbuzz_recovery_controller_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Gbuzz recovery controller cannot inspect the stack
      - alert: GbuzzManagedServiceUnhealthy
        expr: gbuzz_recovery_service_healthy == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Managed service {{ $labels.service }} is unhealthy"
      - alert: GbuzzRecoveryActionFailed
        expr: increase(gbuzz_recovery_actions_total{result="failure"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Automated recovery failed for {{ $labels.service }}"
      - alert: GbuzzRecoveryLoop
        expr: increase(gbuzz_recovery_actions_total{result="success"}[1h]) >= 3
        labels:
          severity: critical
        annotations:
          summary: Recovery action budget is at risk of exhaustion
  - name: windows-endpoint
    rules:
      - alert: WindowsEndpointCollectorDown
        expr: up{job="windows"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Windows endpoint telemetry is unavailable for {{ $labels.endpoint }}"
      - alert: WindowsEndpointDiskCapacityLow
        expr: windows_logical_disk_free_bytes{job="windows",volume=~"[A-Z]:"} / windows_logical_disk_size_bytes{job="windows",volume=~"[A-Z]:"} < 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Windows volume {{ $labels.volume }} has less than 15% free capacity"
      - alert: WindowsEndpointMemoryPressure
        expr: 100 - 100 * windows_memory_physical_free_bytes{job="windows"} / windows_memory_physical_total_bytes{job="windows"} > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Windows endpoint memory usage exceeds 90% on {{ $labels.endpoint }}"
      - alert: WindowsEndpointCpuPressure
        expr: 100 - avg by (instance, endpoint) (rate(windows_cpu_time_total{job="windows",mode="idle"}[5m])) * 100 > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Windows endpoint CPU usage exceeds 90% on {{ $labels.endpoint }}"
