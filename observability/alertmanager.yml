route:
  receiver: local-audit-webhook
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: local-audit-webhook
      matchers: ['severity="critical"']
      repeat_interval: 30m

receivers:
  - name: local-audit-webhook
    webhook_configs:
      - url: http://alert-receiver:8080/alerts
        send_resolved: true
