# Optional external inference; append AFTER docker-compose.graph.yml.
# Changing embedding dimensions requires rebuilding the derived graph.
services:
  graphiti-mcp:
    environment:
      GRAPHITI_LLM_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      GRAPHITI_LLM_API_URL: https://api.openai.com/v1
      GRAPHITI_LLM_MODEL: ${GRAPHITI_PRODUCTION_LLM_MODEL:-gpt-4.1-mini}
      GRAPHITI_EMBEDDING_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      GRAPHITI_EMBEDDING_API_URL: https://api.openai.com/v1
      GRAPHITI_EMBEDDING_MODEL: ${GRAPHITI_PRODUCTION_EMBEDDING_MODEL:-text-embedding-3-small}
      GRAPHITI_EMBEDDING_DIMS: ${GRAPHITI_PRODUCTION_EMBEDDING_DIMS:-1536}
  graphiti-model-init:
    environment:
      GRAPHITI_LLM_API_URL: https://api.openai.com/v1
      GRAPHITI_EMBEDDING_API_URL: https://api.openai.com/v1
