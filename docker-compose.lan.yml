# LAN-only relay publication. Keep this overlay after docker-compose.yml.
services:
  relay:
    environment:
      BUZZ_RELAY_PUBLIC_URL: "http://${BUZZ_LAN_BIND_ADDR:?set explicit private IPv4}:${BUZZ_HTTP_PORT:-3000}"
    ports: !override
      - "${BUZZ_LAN_BIND_ADDR:?set explicit private IPv4}:${BUZZ_HTTP_PORT:-3000}:3000"
