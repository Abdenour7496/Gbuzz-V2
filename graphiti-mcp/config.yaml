server:
  transport: "http"
  host: "0.0.0.0"
  port: 8000

llm:
  provider: "openai"
  model: ${GRAPHITI_LLM_MODEL:qwen2.5:7b}
  max_tokens: 4096
  providers:
    openai:
      api_key: ${GRAPHITI_LLM_API_KEY:ollama}
      api_url: ${GRAPHITI_LLM_API_URL:http://ollama:11434/v1}
      organization_id: ""

embedder:
  provider: "openai"
  model: ${GRAPHITI_EMBEDDING_MODEL:nomic-embed-text}
  dimensions: ${GRAPHITI_EMBEDDING_DIMS:768}
  providers:
    openai:
      api_key: ${GRAPHITI_EMBEDDING_API_KEY:ollama}
      api_url: ${GRAPHITI_EMBEDDING_API_URL:http://ollama:11434/v1}
      organization_id: ""

database:
  provider: "falkordb"
  providers:
    falkordb:
      uri: ${FALKORDB_URI:redis://falkordb:6379}
      password: ${FALKORDB_PASSWORD}
      database: ${FALKORDB_DATABASE:gbuzz}

graphiti:
  group_id: ${GRAPHITI_GROUP_ID:gbuzz}
  episode_id_prefix: ""
  user_id: "gbuzz-projector"
  entity_types:
    - name: "Person"
      description: "A human participant in a Gbuzz chat session"
    - name: "Agent"
      description: "An AI or automation participant in a Gbuzz chat session"
    - name: "Document"
      description: "An uploaded document acting as a participant and source of evidence"
    - name: "Requirement"
      description: "A need, constraint, objective, or acceptance condition"
    - name: "Decision"
      description: "A decision made or proposed within a session"
    - name: "Procedure"
      description: "A repeatable process, instruction, or operational runbook"
    - name: "Event"
      description: "A time-bound occurrence described by a participant"
    - name: "Topic"
      description: "A subject or knowledge domain discussed in a session"
