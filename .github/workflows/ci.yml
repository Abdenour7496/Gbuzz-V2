name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Validate Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet

  python-tests:
    name: Python tests (${{ matrix.component }})
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_ROOT_USER: test
      MINIO_ROOT_PASSWORD: test
      INGEST_WEBHOOK_SECRET: test-only
      SCHEMAS_DIR: ${{ github.workspace }}/schemas
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: proxy
            requirements: proxy/requirements.lock
            test: tests/test_archival_helpers.py
            pythonpath: proxy
          - component: event-projector
            requirements: projector/requirements.lock
            test: projector/test_main.py
            pythonpath: projector
          - component: graphiti-projector
            requirements: graphiti-projector/requirements.lock
            test: graphiti-projector/test_main.py
            pythonpath: graphiti-projector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r "${{ matrix.requirements }}"
      - name: Run unit tests
        env:
          PYTHONPATH: ${{ matrix.pythonpath }}
        run: python -m unittest -v "${{ matrix.test }}"

  recovery-tests:
    name: Python tests (recovery-controller)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v recovery-controller/test_main.py

  integration:
    name: Integration lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the isolated integration stack
        run: docker compose -p gbuzz-integration -f docker-compose.integration.yml up --build --abort-on-container-exit --exit-code-from smoke smoke
      - name: Show service logs after failure
        if: failure()
        run: docker compose -p gbuzz-integration -f docker-compose.integration.yml logs --no-color
      - name: Tear down integration state
        if: always()
        run: docker compose -p gbuzz-integration -f docker-compose.integration.yml down --volumes --remove-orphans

  security:
    name: Supply-chain checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository and dependencies
        uses: aquasecurity/trivy-action@0.32.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
      - name: Generate release SBOM
        if: always()
        uses: anchore/sbom-action@v0.20.6
        with:
          path: .
          format: spdx-json
          output-file: gbuzz.spdx.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gbuzz-sbom
          path: gbuzz.spdx.json

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
